[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "egm-medios-de-vida"
version = "0.1.0"
description = "Mapa de evidencias y brechas (EGM) y tablero analítico de la matriz bibliográfica del proyecto de medios de vida (solo lectura)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Núcleo: una sola dependencia (arquitectura §7, PE-7; NFR-000-14). Nada de la capa web.
dependencies = [
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
# Capa web (ADR-003, punto 1). Opcional para el núcleo: `egm` nunca la importa.
web = [
    "fastapi>=0.165,<1",
    "starlette>=1.10,<2",
    "jinja2>=3.1.6,<4",
    "uvicorn>=0.54,<1",
]
# Desarrollo: incluye la capa web para que `pip install -e ".[dev]"` deje todo listo
# (el servidor se arranca con `python -m app.servidor`).
dev = [
    "egm-medios-de-vida[web]",
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.170,<7",
    "ruff>=0.17.6,<0.18",
    "mypy>=2.4,<3",
    "httpx>=0.28.1,<1",
    "playwright>=1.65,<2",
    "pytest-playwright>=0.10,<1",
    "axe-playwright-python>=0.1.9,<0.2",
]

# --- Estructura `src/`: el paquete `egm` vive en src/egm y `app` en la raíz ------------------
[tool.setuptools]
packages = ["egm", "app"]
package-dir = { "egm" = "src/egm", "app" = "app" }

[tool.setuptools.package-data]
egm = ["py.typed"]

# --- ruff: lint y formato ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "."]
extend-exclude = ["data", "docs", "graphify-out", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RET", "PIE"]

[tool.ruff.lint.isort]
known-first-party = ["egm", "app", "tests"]

[tool.ruff.format]
quote-style = "double"

# --- mypy: estricto solo sobre el núcleo -------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src/egm"]
strict = true
warn_unreachable = true
pretty = true

# --- pytest ------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/egm",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--hypothesis-profile=determinista",
]
markers = [
    "raw: la prueba abre la matriz de data/raw/ en modo binario de lectura (nunca escribe)",
    "navegador: la prueba usa Playwright y vive en tests/navegador/",
]

# --- cobertura: líneas de src/egm ≥ 90 % --------------------------------------------------------
[tool.coverage.run]
source = ["src/egm"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
